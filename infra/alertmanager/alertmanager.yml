# Alertmanager off-VM routing baseline (01A §8.2, 04A-ENG §5)
# Replace placeholder webhook URL in SOPS-encrypted staging/prod configuration before M0 exit.
route:
  receiver: off-vm-ops-webhook
  group_by: ["alertname", "severity"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 1h

receivers:
  - name: off-vm-ops-webhook
    webhook_configs:
      - url: "https://alerts.example.invalid/webhook"
        send_resolved: true
